# Publica TAI Estudio en GitHub Pages.
# Ejecuta build.py y sube SOLO el sitio generado (_site/: index.html, data.js, assets/, temas/).
# Nunca se publican sin-ordenar/, resumenes/ ni _verif/.
# Versiones de las acciones comprobadas en sus releases oficiales (noviembre de 2026).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Construir el sitio
        run: python build.py --dist _site
      - name: Comprobar que no se cuela nada privado
        run: |
          test -f _site/index.html
          test ! -e _site/sin-ordenar
          test ! -e _site/_verif
          test ! -e _site/resumenes
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
